plugins {
    id 'java'
    id 'application'
    id 'checkstyle'
    id 'jacoco'
    id 'com.gradleup.shadow' version '9.5.1'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

repositories {
    mavenCentral()
}

dependencies {
    String jUnitVersion = '5.14.4'

    testImplementation "org.junit.jupiter:junit-jupiter-api:${jUnitVersion}"

    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:${jUnitVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.14.4'
}

test {
    useJUnitPlatform()

    testLogging {
        events 'passed', 'skipped', 'failed'

        showExceptions = true
        exceptionFormat = 'full'
        showCauses = true
        showStackTraces = true
        showStandardStreams = false
    }
}

application {
    mainClass = 'seedu.unienable.UniEnable'
}

jar {
    // A lean JAR file (i.e., without the dependencies packaged inside) is not needed.
    enabled = false
    // Rename its output anyway; Gradle forbids it clashing with the shadowJar output file, even for a disabled task.
    archiveClassifier = 'without-dependencies'
}

shadowJar {
    archiveFileName = 'unienable.jar'
}

checkstyle {
    toolVersion = '14.1.0'
}

run {
    standardInput = System.in
}

// Measure facility commands and the connection foundations for accessible routing.
jacoco {
    toolVersion = '0.8.15'
}

def accessibilityClasses = [
    'seedu/unienable/command/accessibility/facility/**',
    'seedu/unienable/logic/FacilityManager*',
    'seedu/unienable/logic/ConnectionManager*',
    'seedu/unienable/model/Facility*',
    'seedu/unienable/model/Connection*',
    'seedu/unienable/model/enums/AccessibilityStatus*',
    'seedu/unienable/model/enums/ShelterStatus*',
    'seedu/unienable/model/enums/TraversalType*',
    'seedu/unienable/parser/FacilityCommandParser*',
    'seedu/unienable/storage/FacilityStorage*',
    'seedu/unienable/storage/ConnectionStorage*',
    'seedu/unienable/storage/LoadResult*',
    'seedu/unienable/ui/accessibility/**'
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    classDirectories.setFrom(sourceSets.main.output.classesDirs.asFileTree.matching {
        include accessibilityClasses
    })
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(jacocoTestReport.classDirectories)
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                minimum = 1.0
            }
            limit {
                counter = 'BRANCH'
                minimum = 1.0
            }
        }
    }
}

check.dependsOn jacocoTestReport, jacocoTestCoverageVerification
